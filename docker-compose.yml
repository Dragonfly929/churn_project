# OPTIONAL alternative to the native install. The main path (and the class demo) is Kafka started
# from the terminal: bash realtime/kafka/start_kafka.sh. This file starts the same services in containers.
#   docker compose up -d kafka kafka-ui          # Kafka KRaft 4.3.1 + web UI on http://localhost:8080
#   docker compose up -d postgres                # PostgreSQL DWH (user churn / churn, db bank_dwh)
#   docker compose down                          # stop
# The project code is the same in both cases: it connects to localhost:9092 and localhost:5432.
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: churn-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes: ["kafka-data:/var/lib/kafka/data"]
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: churn
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]
  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment: {POSTGRES_USER: churn, POSTGRES_PASSWORD: churn, POSTGRES_DB: bank_dwh}
    volumes: ["pg-data:/var/lib/postgresql/data"]
volumes: {kafka-data: {}, pg-data: {}}
